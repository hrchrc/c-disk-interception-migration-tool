[project]
name = "c-drive-relocator"
version = "0.2.0"
description = "C盘拦迁器：监控/拦截/迁移/修复 C 盘数据目录，符号链接保持软件兼容"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.5",
    "psutil>=5.9",
    "pywin32>=306",
    "requests>=2.28",
]

[tool.ruff]
# 项目为既有大型代码库（约 4 万行），lint 规则只启用"语法/逻辑错误级"，
# 不启用风格规则（避免全仓库爆红）。新代码应自觉遵循 CONTRIBUTING.md 规范。
target-version = "py313"
line-length = 120
extend-exclude = ["src/build", "rust-engine/target"]

[tool.ruff.lint]
# E9 语法错误 / F63 字符串格式化 / F7 语法 / F82 未定义名 —— 安全级检测
select = ["E9", "F63", "F7", "F82"]
